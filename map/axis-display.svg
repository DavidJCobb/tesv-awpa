<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
   <defs>
      <style><![CDATA[
.line {
   fill:   none;
   stroke: #000;
   stroke-width: 5px;
   stroke-linecap: square;
}
.fill {
   fill:   currentColor;
   stroke: currentColor;
   stroke-width: 2.5px;
   stroke-linecap: square;
}
      ]]></style>
      <g id="axis">
         <path class="line" d="M0,0 L68,0 l0,-5 l12,5 l-12,5 l0,-5 Z" />
         <path class="fill" d="M0,0 L68,0 l0,-5 l12,5 l-12,5 l0,-5 Z" />
      </g>
   </defs>
   <use color="#F00" href="#axis" transform="translate(10 90)" />
   <use color="#0A0" href="#axis" transform="translate(10 90) rotate(270)" />
   <circle cx="10" cy="90" r="6" fill="#07F" stroke="#000" stroke-width="2" />
</svg>