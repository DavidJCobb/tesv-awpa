<!doctype html>
<html>
   <head>
      <title>AWPA Map</title>
      <script type="module" src="./awpa-map-element.js"></script>
      <style>
html, body {
   height:  100%;
   padding: 0;
   margin:  0;
   
   font-family: sans-serif;
}
awpa-map {
   width:  100%;
   height: 100%;
}

div[slot="payload-uploads"] {
   ul {
      list-style: none;
      padding: 0;
      margin:  0;
   }
}
      </style>
   </head>
   <body>
      <awpa-map>
         <div slot="payload-uploads">
            <ul>
               <li><input type="file" accept=".xml" multiple /></li>
               <li><input type="file" accept=".xml" multiple /></li>
               <li><input type="file" accept=".xml" multiple /></li>
            </ul>
            <input type="button" value="Load" />
         </div>
      </awpa-map>
      <script type="module" src="./payload-uploader.js"></script>
   </body>
</html>
