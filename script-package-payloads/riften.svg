   <defs>
      <style>
path {
   fill-rule: nonzero;
}
      </style>
      
      <!--
      
         The overall process is as follows:
         
          - Use the CK to read the coordinates of a given piece of architecture 
            (e.g. a building or city wall). Add a `g` element whose transform 
            is `translate(X Y) rotate(-YAW)`.
            
          - Open that piece of architecture's mesh in NifSkope. Right-click on 
            every block of interest and go to Transform -> Apply.
            
             - Axis conventions differ between the game and the web; we can 
               adjust for this on a single transform by negating the yaw angle 
               per-shape, and negating the Y-axis for the entire canvas; but 
               once cumulative transforms come into the picture, this breaks 
               down. Applying transforms in NifSkope ensures that the only 
               transforms we need to work with are those of the ref.
            
          - Select vertices of interest in NifSkope and use these to create a 
            <path />. We do not need to exactly match an object's shape; we 
            only need to come close enough that the city's overall layout is 
            recognizable on the map.
      
      -->
      
